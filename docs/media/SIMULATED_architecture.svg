<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Ortalama: private plant inputs and public arithmetic evidence</title>
<desc id="desc">The simulated prototype runs all roles on one host. The plant reviews reports locally or enters secret manual inputs, creates commitments and a real proof, and sends encrypted shares to three separately keyed trustee stores. The verifier co-signs the public statement. Contracts enforce the frozen cohort and aggregate checks. A replaceable indexer supplies public sidecars and dossiers. The observer also fetches chain state directly and recomputes the mathematics.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526d60"/></marker></defs>
<style>text{font-family:Barlow,Arial,sans-serif;fill:#243330}.title{font-size:31px;font-weight:600}.heading{font-size:21px;font-weight:600}.body{font-size:15px}.small{font-size:13px}.box{fill:#fff;stroke:#a4b0aa;stroke-width:1.3}.wire{fill:none;stroke:#526d60;stroke-width:1.7;marker-end:url(#arrow)}.label{font-size:13px;fill:#526d60}.accent{fill:#a43b1d}</style>
<rect width="1200" height="820" fill="#e9eceb"/>
<text x="44" y="50" class="title">Sealed inputs. Public evidence.</text>
<text x="44" y="78" class="small accent">SIMULATED prototype / all roles on one host / no institutional participation</text>
<rect x="44" y="118" width="342" height="200" class="box"/>
<text x="64" y="151" class="heading">Plant endpoint</text>
<text x="64" y="182" class="body">Report: local AI proposal + source checks</text>
<text x="64" y="206" class="body">Physics review + named officer signature</text>
<text x="64" y="235" class="body">Live mode: unreviewed SIMULATED inputs</text>
<text x="64" y="264" class="body">Private opening + actual Groth16 proof</text>
<text x="64" y="293" class="small">E/P, blindings and individual shares stay private</text>
<rect x="442" y="118" width="282" height="138" class="box"/>
<text x="462" y="151" class="heading">Verifier role adapter</text>
<text x="462" y="182" class="body">ECDSA + ML-DSA co-signature</text>
<text x="462" y="207" class="body">Allowlisted public statement</text>
<text x="462" y="235" class="small">Synthetic key, not accreditation</text>
<path d="M386 180H442" class="wire"/>
<rect x="810" y="118" width="346" height="200" class="box"/>
<text x="830" y="151" class="heading">Three trustee stores</text>
<text x="830" y="182" class="body">Separate signing, encryption and storage keys</text>
<text x="830" y="211" class="body">Validate shares before on-chain ACKs</text>
<text x="830" y="240" class="body">Publish only frozen-cohort share sums</text>
<text x="830" y="270" class="small">Threshold (2,3): two colluding trustees</text>
<text x="830" y="292" class="small">can reconstruct individual plants</text>
<path d="M215 318V348H980V318" class="wire"/>
<text x="552" y="338" class="label">Encrypted shares: X25519 + XChaCha20-Poly1305</text>
<rect x="244" y="412" width="712" height="166" class="box"/>
<text x="266" y="447" class="heading">Public EVM execution: round + generated verifiers + badge registry</text>
<text x="266" y="480" class="body">Immutable parameters / exact manifest / commitment and VSS point sums</text>
<text x="266" y="508" class="body">Authenticated publications / aggregate openings / declared coverage / exact inequality</text>
<text x="266" y="546" class="small accent">Proves protocol arithmetic, not report truth or regulatory acceptance</text>
<path d="M142 318V388H302V412" class="wire"/>
<text x="52" y="376" class="label">Commitments + proof</text>
<path d="M584 256V412" class="wire"/>
<text x="597" y="301" class="label">Co-signature bindings</text>
<path d="M1060 318V387H902V412" class="wire"/>
<text x="960" y="376" class="label">ACKs + sums</text>
<rect x="90" y="656" width="410" height="114" class="box"/>
<text x="112" y="690" class="heading">Replaceable PostgreSQL indexer</text>
<text x="112" y="720" class="body">Public events + signature sidecars + JSON/PDF</text>
<text x="112" y="747" class="small">Private reports and openings are excluded</text>
<rect x="678" y="656" width="478" height="114" class="box"/>
<text x="700" y="690" class="heading">Observer / buyer browser</text>
<text x="700" y="720" class="body">Recompute manifest, sums, openings and signatures</text>
<text x="700" y="747" class="small">Selected RPC + deployment anchor; not a light client</text>
<path d="M385 578V656" class="wire"/>
<text x="95" y="623" class="label">Public event cache, not verification authority</text>
<path d="M850 578V656" class="wire"/>
<text x="864" y="623" class="label">Direct pinned chain reads</text>
<path d="M500 712H678" class="wire" stroke-dasharray="6 5"/>
<text x="527" y="699" class="label">Public sidecars</text>
</svg>
