name: phase-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  crypto-and-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r packages/crypto-py/requirements.txt
      - run: make test-core
      - run: make circuits
      - name: Positive and negative circuit witnesses
        run: node --import tsx --test --test-name-pattern='badge accepts|badge blocks|validity accepts|validity blocks' circuits/test/circuits.test.mjs
  groth16-proofs:
    needs: crypto-and-facts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: make circuits
      - run: node scripts/fetch-ptau.mjs
      # Reuse the recorded full verification of this exact checksum-pinned
      # public ptau; generate and verify fresh test-only phase-2 contributions.
      - run: node scripts/setup-circuits.mjs
      - run: npm run test:circuits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
          cache: false
      - run: make bootstrap-contracts
      - run: make test-contracts
      - run: make coverage-contracts
      - run: python -m venv .tools/audit-venv
      - run: .tools/audit-venv/bin/python -m pip install -r requirements-audit.txt
      - run: make analyze-contracts
